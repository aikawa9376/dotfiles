# tmux起動時のシェルをzshにする
set-option -g default-shell /bin/zsh

# Import the desktop session into newly created panes when a client attaches.
# Indexed entries extend tmux's defaults without replacing DISPLAY/SSH values.
set-option -g update-environment[100] SWAYSOCK
set-option -g update-environment[101] I3SOCK
set-option -g update-environment[102] DBUS_SESSION_BUS_ADDRESS
set-option -g update-environment[103] XDG_RUNTIME_DIR
set-option -g update-environment[104] GTK_IM_MODULE
set-option -g update-environment[105] QT_IM_MODULE
set-option -g update-environment[106] XMODIFIERS
set-option -g update-environment[107] GLFW_IM_MODULE
set-option -g update-environment[108] GDK_BACKEND
set-option -g update-environment[109] QT_QPA_PLATFORM
set-option -g update-environment[110] MOZ_ENABLE_WAYLAND
set-option -g update-environment[111] HYPRLAND_INSTANCE_SIGNATURE

# tmuxを256色表示できるようにする
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm*:Tc"

# 明示的にurf-8
# set -g utf8 on
# 区切りはアスキーで
set -ag terminal-overrides ',*:U8=0'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# prefixキーをC-qに変更
set -g prefix M-b

# C-bのキーバインドを解除
unbind C-b

# 分割して届いたキーコードの続きを待つ上限（通常の Escape は即時処理）
set -g escape-time 250

# アプリの要求がなくても拡張キーを有効にし、CSI-u 形式を使う
set -s 'terminal-features[100]' 'xterm-kitty:extkeys'
set -g extended-keys always
set -g extended-keys-format csi-u

# Kitty → tmux では Escape と Alt を常に区別する
set -s 'terminal-overrides[101]' 'xterm-kitty:Eneks=\E[=1u:Dseks=\E[=0u'

# fzf 中だけ Escape を終了用の Ctrl+G に変換する
set -s 'user-keys[0]' "\e[27u"
bind-key -n User0 if-shell -F '#{==:#{@fzf_csi_u},1}' \
  'send-keys -H 07' 'send-keys -H 1b 5b 32 37 75'

# 通常の Escape にも同じ変換を適用する
bind-key -n Escape if-shell -F '#{==:#{@fzf_csi_u},1}' \
  'send-keys -H 07' 'send-keys -H 1b 5b 32 37 75'

# ステータスバーをトップに配置する
# set-option -g status-position top
set -g status off

# vimのキーバインドでペインを移動する
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_broot="tmux display-message -p '#{pane_current_command}' | grep -qE '^(broot|br)$'"
toggle_nvim_pane="\
if tmux list-panes -t #{window_id} -f '##{==:##{@nvim_f12_pane},1}' | grep -q .; then \
  tmux kill-pane -t \$(tmux list-panes -t #{window_id} -f '##{==:##{@nvim_f12_pane},1}' -F '##{pane_id}' | head -1); \
else \
  tmux set-option -pt \$(tmux split-window -t #{window_id} -d -P -F '##{pane_id}' -v -l 30% -c '#{pane_current_path}') @nvim_f12_pane 1; \
  tmux select-pane -t \$(tmux list-panes -t #{window_id} -f '##{==:##{@nvim_f12_pane},1}' -F '##{pane_id}' | head -1); \
fi"

bind-key -n Left if-shell "$is_broot" \
    "send-keys Left" \
    "if-shell \"$is_vim\" 'send-keys C-w h' 'select-pane -L'"
bind-key -n Right if-shell "$is_broot" \
    "send-keys Right" \
    "if-shell \"$is_vim\" 'send-keys C-w l' 'select-pane -R'"
bind-key -n Down if-shell "$is_vim" 'send-keys C-w j' 'select-pane -D'
bind-key -n Up if-shell "$is_vim" 'send-keys C-w k' 'select-pane -U'

bind -n C-Right select-pane -t :.+
bind -n C-Left select-pane -t :.-
bind -n C-Pageup select-pane -l

# vimのキーバインドでペインをリサイズする
bind -n S-Left if-shell "$is_vim" 'send-keys C-w <' 'resize-pane -L 3'
bind -n S-Down if-shell "$is_vim" 'send-keys C-w +' 'resize-pane -D 3'
bind -n S-Up if-shell "$is_vim" 'send-keys C-w -' 'resize-pane -U 3'
bind -n S-Right if-shell "$is_vim" 'send-keys C-w >' 'resize-pane -R 3'

# nvimからだけM-tで下部ペインをトグルし、補助ペイン上では自分を閉じる
bind -n M-t if-shell -F '#{==:#{@nvim_f12_pane},1}' \
    'kill-pane' \
    "if-shell \"$is_vim\" \"run-shell \\\"$toggle_nvim_pane\\\"\" 'send-keys M-t'"

# Herdr-style agent sidebar (clears stale popup bindings before rebinding).
# source-file /home/aikawa/workspace/agentmux/contrib/agentmux.tmux

# window の作成, 移動
bind n new-window -c "#{pane_current_path}"
bind -n C-Up next-window
bind -n C-Down previous-window

# session の作成, 移動
bind -n M-1 switch-client -n
bind -n M-0 switch-client -p
bind -n C-Pagedown switch-client -l

bind e setw synchronize-panes on
bind E setw synchronize-panes off

# tmuxでhomeとendが効かなくなる問題
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# |でペインを縦分割する
bind | split-window -h -c "#{pane_current_path}"

# - でペインを縦分割する
bind - split-window -v -c "#{pane_current_path}"

# w でペインをwindowに
bind w break-pane

# c でペインを強制リスタート
bind c respawn-pane -k

# 設定ファイルをリロードする
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# 番号基準値を変更
set-option -g base-index 1

# マウス操作を有効にする
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# テーマ
source-file ~/.config/tmux/tmux.theme

# アクティブなpane
set -g window-style 'bg=#073642'
set -g window-active-style 'bg=#002b36'

# コピーモードを設定する
bind Space copy-mode

# コピーモードでvimキーバインドを使う
set -g mode-keys vi

# コピーした後、コピーモードは維持するが、選択範囲は解除する
set -g @yank_action 'copy-pipe'

# tmux-thumb
set -g @thumbs-key p
set -g @thumbs-command 'echo -n {} | copyq add -'

## クリップボード共有を有効にする
# set-option -g default-command "reattach-to-user-namespace -l zsh"
set-option -g default-command ""

# 'v' で選択を始める
bind -T copy-mode-vi v send -X begin-selection

# 'V' で行選択
bind -T copy-mode-vi V send -X select-line

# 'C-v' で矩形選択
bind -T copy-mode-vi C-v send -X rectangle-toggle

# 'y' でヤンク
bind -T copy-mode-vi y send -X copy-selection

# 'Y' で行ヤンク
bind -T copy-mode-vi Y send -X copy-line

# 'Esc' でぬける
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi User0 send -X cancel

# 'p'でペースト
bind p paste-buffer

# Extended keys keep C-S-i distinct from Tab; preserve the old action without
# routing the key through a private Unicode character in kitty.
bind-key -n C-S-i send-keys BTab

# Speed: 0-1000 | lower = faster
set -g @smooth-scroll-speed "10"

set-hook -g client-detached \
  'run-shell "$XDG_CONFIG_HOME/tmux/scripts/resurrect-save-on-client-detached #{hook_client}"'

# kitty test
bind [ run-shell '\
  kitty @ kitten /home/aikawa/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py \
  --env "TMUX=$TMUX" \
  --env "TMUX_PANE=#{pane_id}"'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fcsonline/tmux-thumbs'

set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Source the guard so it can abort save.sh before an incomplete layout becomes last.
set -g @resurrect-hook-post-save-layout '. "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/resurrect-validate-layout"'

set -g @plugin 'azorng/tmux-smooth-scroll'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"

if-shell -F "#{!=:#{@resurrect_restored},on}" "run-shell \"$XDG_CONFIG_HOME/tmux/plugins/tmux-resurrect/scripts/restore.sh\"; set -g @resurrect_restored on"'
